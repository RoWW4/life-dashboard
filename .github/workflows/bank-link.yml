name: Conectar banco

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Déjalo VACÍO la primera vez. Después pega aquí el código que te muestra el panel.'
        required: false
        default: ''
      conexion:
        description: 'Qué conectar: openbank (gastos), trade-republic (ahorro) o lista (solo ver qué bancos hay, sin conectar nada)'
        type: choice
        options:
          - openbank
          - trade-republic
          - lista
        default: 'openbank'

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # si algo se cuelga, GitHub la corta en vez de esperar 6 h
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Conectar
        run: node scripts/bank-link.mjs
        env:
          EB_CODE: ${{ inputs.code }}
          EB_CONN: ${{ inputs.conexion }}
          TR_IBAN: ${{ secrets.TR_IBAN }}   # IBAN de la cuenta de Trade Republic (solo para la conexión trade-republic)
          EB_APP_ID: ${{ secrets.EB_APP_ID }}
          EB_PRIVATE_KEY: ${{ secrets.EB_PRIVATE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LDB_USER_ID: ${{ secrets.LDB_USER_ID }}
