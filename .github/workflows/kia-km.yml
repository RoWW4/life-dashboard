name: Coche (Kia Connect)

# Cada 3 horas, de 7 a 22 h (hora de invierno), lee en Kia Connect el último estado guardado del coche (sin despertarlo):
# km, combustible, avisos, cierre, ubicación y viajes, y los guarda en la sección Coche del panel. También a mano.
# Secretos: KIA_USER y KIA_PASSWORD (cuenta de Kia Connect), KIA_PIN si la cuenta lo pide, y los de Supabase.
on:
  schedule:
    - cron: '17 6-21/3 * * *'
  workflow_dispatch:
    inputs:
      diag:
        description: 'Prueba: ver qué datos manda el coche (solo nombres, sin valores)'
        type: boolean
        default: false
      backfill:
        description: 'Rellenar los viajes de los últimos meses'
        type: boolean
        default: false

concurrency:
  group: kia-km
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  km:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar
        run: pip install --quiet hyundai_kia_connect_api==5.3.1
      - name: Leer km
        run: python scripts/kia-km.py
        env:
          KIA_USER: ${{ secrets.KIA_USER }}
          KIA_PASSWORD: ${{ secrets.KIA_PASSWORD }}
          KIA_PIN: ${{ secrets.KIA_PIN }}
          KIA_DIAG: ${{ inputs.diag && '1' || '' }}
          KIA_BACKFILL: ${{ inputs.backfill && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
