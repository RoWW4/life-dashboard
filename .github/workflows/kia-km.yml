name: Coche (Kia Connect)

# Lee en Kia Connect el último estado guardado del coche (sin despertarlo): km, combustible, avisos, cierre,
# ubicación y viajes, y los guarda en la sección Coche del panel. La lanza Supabase cada hora (pg_cron, tarea
# «kia-km»: 0 6-21 * * * UTC ≈ de 07:00 a 22:00 en invierno; en verano, una hora más) llamando a la API de GitHub, como
# el banco, porque el «schedule» de GitHub se retrasaba. También con «Actualizar» en Coche (ldb_car_refresh) y a mano (Run workflow).
# Secretos: KIA_USER y KIA_PASSWORD (cuenta de Kia Connect), KIA_PIN si la cuenta lo pide, y los de Supabase.
on:
  workflow_dispatch:
    inputs:
      diag:
        description: 'Prueba: ver qué datos manda el coche (solo nombres, sin valores)'
        type: boolean
        default: false
      backfill:
        description: 'Rellenar los viajes de los últimos meses'
        type: boolean
        default: false

concurrency:
  group: kia-km
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  km:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Solo el robot: el resto del repositorio no hace falta y así arranca antes.
          sparse-checkout: |
            scripts/kia-km.py
            .github/workflows/kia-km.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/kia-km.yml
      - name: Instalar
        run: pip install --quiet hyundai_kia_connect_api==5.3.1
      - name: Leer km
        run: python scripts/kia-km.py
        env:
          KIA_USER: ${{ secrets.KIA_USER }}
          KIA_PASSWORD: ${{ secrets.KIA_PASSWORD }}
          KIA_PIN: ${{ secrets.KIA_PIN }}
          KIA_DIAG: ${{ inputs.diag && '1' || '' }}
          KIA_BACKFILL: ${{ inputs.backfill && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
