name: Sincronizar banco

# La lanza Supabase 4 veces al día (pg_cron, tarea «bank-sync»: 43 5,10,14,19 * * * UTC ≈ 06:43, 11:43, 15:43 y
# 20:43 en invierno; en verano, una hora más) llamando a la API de GitHub, como los avisos. Antes usaba el «schedule»
# de GitHub, que se retrasaba de 1 a 4 horas (10/11/2026). 4 al día es el máximo que permite PSD2 sin que estés delante.
# Pausarla: select cron.alter_job((select jobid from cron.job where jobname = 'bank-sync'), active := false);
# También se puede lanzar a mano (Run workflow).
on:
  workflow_dispatch:

# Nunca dos sincronizaciones a la vez (p. ej. una manual y una programada).
concurrency:
  group: bank-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # si algo se cuelga, GitHub la corta en vez de esperar 6 h
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Traer movimientos
        run: node scripts/bank-sync.mjs
        env:
          EB_APP_ID: ${{ secrets.EB_APP_ID }}
          EB_PRIVATE_KEY: ${{ secrets.EB_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LDB_USER_ID: ${{ secrets.LDB_USER_ID }}
          # Correos de fallo en pausa desde el 08/11/2026: el error se sigue guardando y se ve en el panel. Para reactivarlos, poner '0'.
          SIN_CORREO: '1'
